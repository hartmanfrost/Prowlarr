# CI for the ash cluster's patched Prowlarr image.
# Lives only on the `ash` branch (develop + our upstream PRs #2699/#2700/#2701).
# Pushes a moving `ash-latest` tag (tracked by argocd-image-updater via digest)
# and an immutable `ash-<sha>` tag for rollbacks.
name: Build ash image

on:
  push:
    branches: [ash]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run indexer unit tests
        run: |
          dotnet test src/NzbDrone.Core.Test/Prowlarr.Core.Test.csproj \
            -p:SolutionDir=$GITHUB_WORKSPACE/src/ \
            --filter "FullyQualifiedName~IndexerTests" \
            --logger "console;verbosity=minimal"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/prowlarr:ash-latest
            ghcr.io/${{ github.repository_owner }}/prowlarr:ash-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
